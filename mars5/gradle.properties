kotlin.code.style=official
# Clean compilation of the IntelliJ platform fixtures needs more than the default compiler heap.
kotlin.daemon.jvmargs=-Xmx2g
# IntelliJ supplies its Kotlin runtime; do not bundle a second copy.
kotlin.stdlib.default.dependency=false

# JMH emits shared metadata despite declaring an isolating processor. Dagger uses KSP.
kapt.incremental.apt=false
