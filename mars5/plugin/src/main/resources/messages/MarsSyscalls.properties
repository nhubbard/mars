# The syscall catalog enumerates the bundle keys at runtime.
# suppress inspection "UnusedProperty" for whole file
# Service number = registry name | argument registers | results and effects
1=PrintInt|$a0 = integer|Prints a signed decimal integer.
2=PrintFloat|$f12 = float|Prints the floating-point value.
3=PrintDouble|$f12/$f13 = double|Prints the double-precision value.
4=PrintString|$a0 = address of a null-terminated string|Prints the string.
5=ReadInt|None|$v0 = integer read from input.
6=ReadFloat|None|$f0 = float read from input.
7=ReadDouble|None|$f0/$f1 = double read from input.
8=ReadString|$a0 = buffer address, $a1 = buffer capacity|Writes up to $a1 - 1 characters, with a newline if there is room, followed by a null byte. A capacity less than 1 leaves memory untouched.
9=Sbrk|$a0 = number of bytes to allocate|$v0 = address of allocated heap memory.
10=Exit|None|Terminates execution.
11=PrintChar|$a0 = character value|Prints the character from the low byte of $a0.
12=ReadChar|None|$v0 = character read from input.
13=Open|$a0 = filename string address, $a1 = flags, $a2 = ignored mode|$v0 = descriptor or negative error. Flags are 0 for read, 1 for write/create, and 9 for write/create/append.
14=Read|$a0 = descriptor, $a1 = buffer address, $a2 = maximum bytes|$v0 = bytes read, 0 at end of file, or negative on error. Writes the bytes to the buffer.
15=Write|$a0 = descriptor, $a1 = buffer address, $a2 = byte count|$v0 = bytes written or negative on error.
16=Close|$a0 = descriptor|Closes the file.
17=Exit2|$a0 = exit status|Terminates execution with the supplied status.
30=Time|None|$a0 = low 32 bits and $a1 = high 32 bits of milliseconds since the Unix epoch.
31=MidiOut|$a0 = pitch, $a1 = duration in ms, $a2 = instrument, $a3 = volume|Starts a MIDI tone and returns without waiting for it to finish.
32=Sleep|$a0 = duration in ms|Pauses execution for at least the requested interval.
33=MidiOutSync|$a0 = pitch, $a1 = duration in ms, $a2 = instrument, $a3 = volume|Plays a MIDI tone and waits for it to finish.
34=PrintIntHex|$a0 = integer|Prints an eight-digit hexadecimal value with a 0x prefix.
35=PrintIntBinary|$a0 = integer|Prints the 32-bit binary value.
36=PrintIntUnsigned|$a0 = integer|Prints the unsigned decimal value.
40=RandSeed|$a0 = random stream ID, $a1 = seed|Sets the stream seed.
41=RandInt|$a0 = random stream ID|$a0 = next random integer.
42=RandIntRange|$a0 = random stream ID, $a1 = exclusive upper bound|$a0 = next random integer in the range 0 <= value < $a1.
43=RandFloat|$a0 = random stream ID|$f0 = next random float in [0, 1).
44=RandDouble|$a0 = random stream ID|$f0/$f1 = next random double in [0, 1).
50=ConfirmDialog|$a0 = prompt string address|$a0 = 0 for yes, 1 for no, or 2 for cancel.
51=InputDialogInt|$a0 = prompt string address|$a0 = integer, $a1 = status (0 success, -1 invalid number, -2 canceled, -3 empty).
52=InputDialogFloat|$a0 = prompt string address|$f0 = float, $a1 = status (0 success, -1 invalid number, -2 canceled, -3 empty).
53=InputDialogDouble|$a0 = prompt string address|$f0/$f1 = double, $a1 = status (0 success, -1 invalid number, -2 canceled, -3 empty).
54=InputDialogString|$a0 = prompt string address, $a1 = buffer address, $a2 = buffer capacity|Writes a null-terminated string on success or truncation. $a1 = status (0 success, -2 canceled, -3 empty, -4 truncated).
55=MessageDialog|$a0 = message string address, $a1 = message type|Shows a dialog. Types 0, 1, 2, 3 select error, information, warning, and question.
56=MessageDialogInt|$a0 = message string address, $a1 = integer|Shows the message followed by the integer.
57=MessageDialogFloat|$a0 = message string address, $f12 = float|Shows the message followed by the float.
58=MessageDialogDouble|$a0 = message string address, $f12/$f13 = double|Shows the message followed by the double. $a1 = -1 if the pair is invalid.
59=MessageDialogString|$a0 = message string address, $a1 = second string address|Shows the message followed by the second string.
60=ClearScreen|None|Clears the simulator console.
