start.title=Getting started with MARS
start.body=<p>Choose MARS MIPS in the IntelliJ New Project wizard, or add a file ending in <code>.asm</code> or <code>.s</code> to an existing project. The wizard can create an entry file and a separate assembly library.</p>\
  <p>Use the Build menu to assemble the current source, its directory, or the configured project sources. Select the ordered source list in <b>Settings → Build, Execution, Deployment → MARS Assembly</b>. The first file is the entry point. Diagnostic locations in the Build tool window open the affected source.</p>\
  <p>Choose Run or Debug from the editor gutter, or create a MARS MIPS run configuration to set sources, program arguments, working directory, and execution options. Quick Documentation explains the instruction or directive at the caret.</p>
macros.title=Macros, equivalences, and includes
macros.body=<p>Declare a macro with <code>.macro name (%argument)</code> and end its body with <code>.end_macro</code>. Invoke it as <code>name ($t0)</code>. Macro parameters are substituted in the body and labels defined inside a macro are renamed for each expansion.</p>\
  <p><code>.eqv NAME replacement</code> substitutes tokens in later uses of <code>NAME</code>. <code>.include "library.s"</code> reads a source path relative to the including file. Includes are processed before equivalence substitutions.</p>\
  <p>Use <b>Show Generated MIPS Instructions</b> from the editor context menu to inspect the assembled expansion and navigate to its source. Quick Documentation at a macro call shows its signature.</p>
debug.title=Run, Debug, and console input
debug.body=<p>Set a line breakpoint in the gutter before starting Debug. Use the Debug tool window to step through source, inspect frames and watches, or resume execution. In Disassembly, use address breakpoints to stop at an individual machine instruction.</p>\
  <p>Conditions and watches accept registers such as <code>$t0</code>, labels, arithmetic, and memory reads such as <code>word($sp)</code>. Backstep reverses a source step or an instruction when history is available. Use the machine views to inspect registers, memory, and disassembly while stopped.</p>\
  <p>For input syscalls, type into the Run or Debug console and submit the line. The run configuration can select dialogs for standard input. A run can also export initialized memory on completion.</p>
exceptions.title=Exceptions and handler sources
exceptions.body=<p>Set an <b>Exception handler source</b> under MARS Assembly to assemble it before the program. Use <code>.ktext</code> to place the handler at the exception vector for the selected layout. The default vector is <code>0x80000180</code>; the compact layouts use <code>0x00004180</code>.</p>\
  <p>Inspect Cause, Status, BadVAddr, and EPC in the Coprocessor 0 debugger view. EPC identifies the interrupted instruction or branch; a handler can inspect the cause and adjust EPC as needed before returning with <code>eret</code>.</p>
cli.title=Standalone command-line builds
cli.body=<p>Run the standalone MARS CLI JAR with <code>--help</code> for the installed option list. Pass ordered assembly files, use <code>--project</code> to discover sibling sources, or use <code>--assemble-only</code> to assemble without executing.</p>\
  <p><code>--</code> starts simulated program arguments. Use <code>--register</code>, <code>--memory-range</code>, or <code>--instruction-count</code> for post-run reports, and <code>--dump REGION FORMAT FILE</code> for memory exports. Use <code>--messages-to-stderr</code> to separate launcher reports and phase traces from program output.</p>\
  <p>The process normally returns the simulated exit code. Assembly and simulation errors can use separate overrides, while reaching a step limit returns 3.</p>
tools.title=Educational tools and simulated devices
tools.body=<p>Open <b>MARS Tools</b> and select a Run or Debug execution. Each tool observes only the selected execution. Use the tool controls to connect, reset, or configure its model.</p>\
  <p>Explore branch prediction, cache behavior, instruction statistics, the datapath, floating-point representation, and memory references. Interactive devices include the bitmap display, digital lab, keyboard and display, terminal, and MarsBot. The Introduction to Tools panel explains how to build a Kotlin tool provider.</p>
about.title=About MARS
about.body=<p>MARS (MIPS Assembler and Runtime Simulator) was developed by Pete Sanderson and Kenneth Vollmar. MARS 5 brings the assembler, simulator, and educational tools to IntelliJ.</p>\
  <p>Find the original contributors in <b>MARS acknowledgements</b> and the changes to the desktop releases in <b>MARS release history</b>. The original MARS license and third-party notices are available in this reference.</p>\
  <p>The external MIPS/SPIM reference card by Jan Wätzig is available from the original MARS project using the link below.</p>
