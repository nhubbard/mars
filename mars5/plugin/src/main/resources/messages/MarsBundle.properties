tools.intro.name=Introduction to Tools
tools.intro.steps=Observed instructions: {0}
tools.intro.guide=This live example counts instructions in the selected MIPS execution. Select a Run or Debug session, then continue or step it. The count starts at zero when you change executions.\n\nTo add a tool from another Kotlin plugin, depend on edu.missouristate.mars and implement MarsToolProvider. Give it a unique ID and a display title. Register the implementation under edu.missouristate.mars.toolProvider in your plugin descriptor. IntelliJ creates the tab content when it is first selected.\n\nMarsToolContext provides the project, a native execution selector, and a disposable for the tab. Bind a listener to the selected MarsToolExecution and dispose that binding when the selection changes. Instruction callbacks arrive on the simulation worker. Record data there and update Swing on the event dispatch thread.\n\nThe source of this tab, IntroToToolsProvider.kt, is a complete example.

