doubling.intro=The example computes twice an input plus one. The highlighted addition names its destination first, followed by its two sources. Choose an answer below; use the feedback to revise it if necessary.
negative.intro=Reading a source does not consume its value. Now consider input -3: follow the doubling instruction and the highlighted addition of one, then choose the final result below.
output.intro=The retained arithmetic answer must reach the integer-output argument. Track the most recent writer of each register, inspect the highlighted copy and choose the prediction below.
wrong-output.intro=This separate counterexample prepares the output argument from the service-selector register. Find the last writer of $v0 before the highlighted copy, then predict the printed number below.
diagnosis.intro=The arithmetic result is correct, but the output argument is wrong. Inspect the highlighted copy and choose the repair that addresses the first incorrect state.

