module.name=Your first assembly program
module.description=Follow a value from an expression into machine state.
lesson.predictions.name=Predicting register changes
lesson.doubling.text=The example computes twice an input plus one. An instruction names its destination first and then its sources. With 20 in $v0, predict what addu $t0, $v0, $v0 changes. Open {0}; use the feedback to revise a prediction if necessary.
lesson.negative.text=Reading a source does not consume its value. The next instruction adds the immediate constant one to the doubled value. Now consider input -3: open {0} and follow the two additions.
lesson.predictions.conclusion=The destination tells you where to look after an instruction. Sources supply the values it reads; an immediate supplies a constant from the instruction. In the written lab, make the same predictions at an actual Debug pause and compare them with source stepping.
prediction.title=Predict the register state
prediction.check=Check prediction
prediction.choose=Choose a prediction before checking it.
doubling.question=With 20 in $v0, what is the state after addu $t0, $v0, $v0?
doubling.a=$t0 is 40; $v0 is still 20.
doubling.a.feedback=The first operand is the destination. Both source operands read 20, so the sum written to $t0 is 40.
doubling.b=$t0 is 20; reading $v0 twice consumes the input.
doubling.b.feedback=Reading a register does not consume its value. Each source operand reads the same 20, so both values contribute to the addition.
doubling.c=$v0 is 40; $t0 is unchanged.
doubling.c.feedback=The first operand is the destination: $t0. The two occurrences of $v0 name sources, not the register that receives the sum.
negative.question=Input -3 is doubled with addu, then addiu adds one. What is the result in $t0?
negative.a=7
negative.a.feedback=The u does not turn -3 into a positive magnitude. It specifies that signed overflow does not trap; these inputs do not overflow.
negative.b=-7
negative.b.feedback=The immediate is positive one. Starting at -6, adding one moves toward zero, giving -5.
negative.c=-5
negative.c.feedback=Doubling gives -6, then adding one gives -5. Both results fit in the word range used by these instructions.

lesson.run.name=Following a complete Run
lesson.run.text=Run first-program.asm using the normal MARS Run action with the default MIPS64 execution options. Enter 20 in its console and press Enter. The program should print 41 after the answer message and exit normally. This checkpoint observes that Run and the source it executed. If you edit the program, run it again; an earlier result cannot verify new source. Use the complete single-file example for this observation. The independent-writing activity will check a different calculation separately.
lesson.run.conclusion=The console result agrees with the prediction for input 20. This establishes an observed result for one execution, not every possible input. Debugging will let you inspect the intermediate 40 and 41 and investigate where a different result first appears.

lesson.debug.name=Following the arithmetic in Debug
lesson.debug.before=Set a breakpoint on addu $t0, $v0, $v0 under calculate. Start Debug for this file using the default MIPS64 options and enter 20 in its console. A breakpoint pauses before the highlighted instruction executes. Expand the Integer registers group and find $v0: it should hold the returned input, 20. The next instruction will read it twice and write their sum to $t0. Use the complete single-file example. Start a new Debug session if you change its source.
lesson.debug.doubled=The pause before the addition shows $v0 = 20. Predict the destination value, then use Step Over once. The instruction reads both sources before it writes the destination. At the next pause, $t0 should be 40 and $v0 should still be 20. The newly highlighted addiu has not executed yet.
lesson.debug.incremented=The first addition produced 40 without consuming the input register. The highlighted addiu reads that 40, adds the immediate constant 1 and replaces $t0. Use Step Over once more, then inspect $t0. The next pause should show 41; $v0 still holds 20 because neither arithmetic instruction writes it.
lesson.debug.conclusion=You have observed the input, doubled value and incremented value in one Debug session. The highlighted source is the next operation to execute. A correct 41 in $t0 establishes the arithmetic result at this boundary. If later console output is wrong, investigate the output argument and service selection next. Resume or stop Debug when you have finished inspecting the state.

lesson.output.name=Preparing the integer output
lesson.output.predict=The calculation leaves 41 in $t0, but printing the answer prefix reuses $v0 as a service selector. Next, move $a0, $t0 copies the answer, and li $v0, 1 selects integer output. Open {0} and predict the state just before the following syscall. Track the most recent writer of each register.
output.question=With input 20, what do the registers contain just before the integer-output syscall, after move $a0, $t0 and li $v0, 1?
output.a=$v0 is 41; $a0 is 1; $t0 is 41.
output.a.feedback=The service selector is in $v0 and its argument is in $a0. move copies 41 into $a0, while li writes 1 into $v0.
output.b=$v0 is 1; $a0 is 41; $t0 is 41.
output.b.feedback=The syscall selects service 1 from $v0 and reads the number 41 from $a0. Copying the answer leaves the original 41 in $t0. The selector and the answer have different roles.
output.c=$v0 is 20; $a0 is 41; $t0 is 0.
output.c.feedback=$v0 no longer holds the input: later li instructions have overwritten it. move copies its source without clearing it, so $t0 remains 41.
lesson.output.before=Stop the preceding Debug session. Set a breakpoint on move $a0, $t0 below report, then start a new Debug session and enter 20. Remove the earlier arithmetic breakpoint or resume past it. At the output breakpoint, $t0 should retain 41 and $v0 should be 4, the selector used to print the answer prefix. $a0 still contains that string's address. The highlighted move has not executed. In hexadecimal, 20 is 0x14 and 41 is 0x29; service selectors 1 and 4 have the same digits in decimal and hexadecimal.
lesson.output.argument=Step Over the move once. It copies the answer into $a0 without clearing $t0. Both should now contain 41. $v0 is still 4 because move did not write it. The highlighted li $v0, 1 is the next instruction to execute; its presence in the editor does not mean the selector has changed yet.
lesson.output.selector=Step Over li $v0, 1. At the pause before syscall, $v0 should be 1, while $a0 and $t0 still contain 41. Loading a service selector does not change the answer. The upcoming syscall uses the selector to choose integer output and the argument to choose which number to print.
lesson.output.conclusion=You observed the answer survive while two output registers changed roles. Resume and compare the console with the argument, or stop Debug after inspecting it. This checkpoint verifies the state before the output request; the earlier Run checked normal program completion. If $t0 is correct but $a0 is wrong, inspect the instruction that prepared the argument before changing the arithmetic.

lesson.diagnosis.name=Locating a wrong output argument
lesson.diagnosis.predict=wrong-output.asm is a separate counterexample. Its arithmetic matches the worked program, but the integer-output argument is prepared with move $a0, $v0. Keep first-program.asm unchanged. Find the last writer of $v0 before this copy, then open {0}. Predict the printed number for input 20 before starting the debugger.
wrong-output.question=In wrong-output.asm, move $a0, $v0 follows the prefix-printing syscall and precedes li $v0, 1. What integer will it print for input 20?
wrong-output.a=4
wrong-output.a.feedback=The prefix request selected service 4 in $v0. The faulty move copies that 4 into $a0. The later li changes $v0 to 1 without changing $a0, so integer output prints 4.
wrong-output.b=20
wrong-output.b.feedback=The input call returned 20 in $v0 earlier, but li $v0, 4 has since replaced it to select prefix output. Follow the most recent writer, rather than a register's earlier role.
wrong-output.c=41
wrong-output.c.feedback=The arithmetic leaves 41 in $t0. This copy reads $v0 instead, so the correct answer is never passed to integer output.
lesson.diagnosis.before=Stop other Debug sessions. In wrong-output.asm, set a breakpoint on move $a0, $v0 below report. Start Debug for this file with default MIPS64 options and enter 20. At the breakpoint, inspect $t0 and $v0: the arithmetic answer is 41, while the current selector is 4. The highlighted copy has not executed. This observation uses the counterexample; your repair will go in a separate file so the failure remains available for comparison.
lesson.diagnosis.argument=Step Over the faulty copy once. $a0 should now be 4, while $t0 remains 41 and $v0 remains 4. This is the first incorrect argument state: copying preserved the source, but read the wrong source register. The arithmetic result itself is still correct. In hexadecimal, 41 is 0x29.
lesson.diagnosis.selector=Step Over li $v0, 1 once. Before syscall, the service selector should be 1 and its argument should still be 4. Selecting integer output does not repair the argument. Compare this pause with the preceding output lesson, where the selector was also 1 but the argument was 41.
lesson.diagnosis.explain=Use the observed state to choose where a repair belongs: open {0}. Distinguish the correct arithmetic result, correct service selector and incorrect argument. A wrong console number alone does not identify which of these produced the fault.
diagnosis.question=Before the faulty integer-output syscall, $t0 is 41, $v0 is 1 and $a0 is 4. Which change addresses the first incorrect state?
diagnosis.a=Change the arithmetic because the printed answer is wrong.
diagnosis.a.feedback=The stopped arithmetic result is already 41 in $t0. Changing the additions would alter a value that was correct before output preparation.
diagnosis.b=Keep the argument and select string output instead.
diagnosis.b.feedback=The program needs integer output, so selector 1 is correct. String output would interpret 4 as an address, rather than print the intended answer.
diagnosis.c=Prepare the integer-output argument from the retained answer instead of the service selector.
diagnosis.c.feedback=The copy is the first instruction that puts the wrong value into the output argument. Prepare $a0 from the retained answer in $t0; keep integer-output service 1 and the correct arithmetic.
lesson.diagnosis.conclusion=You located an argument error while the calculation and service selection remained correct. Resume to compare the predicted 4 with the console, or stop Debug after the observation. The next lesson creates repair-output.asm from the same faulty source. It preserves that working file on restart and leaves this counterexample available for comparison.
lesson.repair.name=Repairing the output argument
lesson.repair.text=Stop the counterexample's Debug session. repair-output.asm is your working copy of the faulty program. Repair the integer-output argument preparation while preserving the input, arithmetic, messages and normal exit. Use the evidence from the previous lesson to choose the value to copy. Run this file with default MIPS64 options and input 20: it should print 41. This checkpoint observes the executed source and exact transcript, not an instruction spelling. Edits require a fresh Run. The worked example and counterexample are separate files; restarting preserves your repair.
lesson.repair.conclusion=The repaired source printed 41 and exited normally for the observed run. Compare the repaired argument preparation with wrong-output.asm and explain which register's role caused the original mistake. This one execution checks the repair for input 20; the independent-writing activity will require a related calculation and several inputs. Keep your working file and reasoning for review.

lesson.independent.name=Writing a related program independently
lesson.independent.text=In independent.asm, implement 3x+1 for integer inputs from -1000 through 1000. The data section supplies the exact prompt, answer prefix and newline; write the program body using the input and output services you have studied. Choose your own scratch registers and labels. Work out the intermediate values for 20, 0 and -3 before executing. Use a single source file and the default MIPS64 options. Open {0} to assemble the current editor text and run five public cases in separate machines: 20, 0, -3, -1000 and 1000. Each case must print the supplied prompt, prefix, number and newline, then exit normally within 2000 instructions. Explain failures from the first incorrect state, revise your source and check again. An edit invalidates earlier execution evidence. Your Run and Debug sessions are separate from these checks.
lesson.independent.conclusion=Your current source passed all five public cases. Explain how its instructions compute 3x+1 for the stated range, and trace one positive and one negative input using your chosen registers. Successful cases support that reasoning; they do not replace it with a proof for every input. Try a different temporary register and check the changed program again. Keep the source and explanation for review.
independent.check.progress=Checking the independent program
independent.check.title=Independent program results
independent.check.close=Return to editor
independent.check.assembly=Assembly did not succeed. Read the Build diagnostics, correct the source and check again.
independent.check.stale=The checked source or lesson attempt changed. Select the independent program and check its current source again. This first exercise uses one source file without a custom exception handler.
independent.check.scope=These are public formative checks for the stated interface and inputs. Explain your algorithm for the full range; private instructor grading is separate.
