module.name=Your first assembly program
module.description=Follow a value from an expression into machine state.
lesson.predictions.name=Predicting register changes
lesson.doubling.text=The example computes twice an input plus one. An instruction names its destination first and then its sources. With 20 in $v0, predict what addu $t0, $v0, $v0 changes. Open {0}; use the feedback to revise a prediction if necessary.
lesson.negative.text=Reading a source does not consume its value. The next instruction adds the immediate constant one to the doubled value. Now consider input -3: open {0} and follow the two additions.
lesson.predictions.conclusion=The destination tells you where to look after an instruction. Sources supply the values it reads; an immediate supplies a constant from the instruction. In the written lab, make the same predictions at an actual Debug pause and compare them with source stepping.
prediction.title=Predict the register state
prediction.check=Check prediction
prediction.choose=Choose a prediction before checking it.
doubling.question=With 20 in $v0, what is the state after addu $t0, $v0, $v0?
doubling.a=$t0 is 40; $v0 is still 20.
doubling.a.feedback=The first operand is the destination. Both source operands read 20, so the sum written to $t0 is 40.
doubling.b=$t0 is 20; reading $v0 twice consumes the input.
doubling.b.feedback=Reading a register does not consume its value. Each source operand reads the same 20, so both values contribute to the addition.
doubling.c=$v0 is 40; $t0 is unchanged.
doubling.c.feedback=The first operand is the destination: $t0. The two occurrences of $v0 name sources, not the register that receives the sum.
negative.question=Input -3 is doubled with addu, then addiu adds one. What is the result in $t0?
negative.a=7
negative.a.feedback=The u does not turn -3 into a positive magnitude. It specifies that signed overflow does not trap; these inputs do not overflow.
negative.b=-7
negative.b.feedback=The immediate is positive one. Starting at -6, adding one moves toward zero, giving -5.
negative.c=-5
negative.c.feedback=Doubling gives -6, then adding one gives -5. Both results fit in the word range used by these instructions.

lesson.run.name=Following a complete Run
lesson.run.text=Run first-program.asm using the normal MARS Run action with the default MIPS64 execution options. Enter 20 in its console and press Enter. The program should print 41 after the answer message and exit normally. This checkpoint observes that Run and the source it executed. If you edit the program, run it again; an earlier result cannot verify new source. Use the complete single-file example for this observation. The independent-writing activity will check a different calculation separately.
lesson.run.conclusion=The console result agrees with the prediction for input 20. This establishes an observed result for one execution, not every possible input. Debugging will let you inspect the intermediate 40 and 41 and investigate where a different result first appears.

lesson.debug.name=Following the arithmetic in Debug
lesson.debug.before=Set a breakpoint on addu $t0, $v0, $v0 under calculate. Start Debug for this file using the default MIPS64 options and enter 20 in its console. A breakpoint pauses before the highlighted instruction executes. Expand CPU registers and find $v0: it should hold the returned input, 20. The next instruction will read it twice and write their sum to $t0. Use the complete single-file example. Start a new Debug session if you change its source.
lesson.debug.doubled=The pause before the addition shows $v0 = 20. Predict the destination value, then use Step Over once. The instruction reads both sources before it writes the destination. At the next pause, $t0 should be 40 and $v0 should still be 20. The newly highlighted addiu has not executed yet.
lesson.debug.incremented=The first addition produced 40 without consuming the input register. The highlighted addiu reads that 40, adds the immediate constant 1 and replaces $t0. Use Step Over once more, then inspect $t0. The next pause should show 41; $v0 still holds 20 because neither arithmetic instruction writes it.
lesson.debug.conclusion=You have observed the input, doubled value and incremented value in one Debug session. The highlighted source is the next operation to execute. A correct 41 in $t0 establishes the arithmetic result at this boundary. If later console output is wrong, investigate the output argument and service selection next. Resume or stop Debug when you have finished inspecting the state.
