name: Build
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mars5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: ./gradlew build :core:benchmarkClasses --no-daemon
      - run: java -jar cli/build/libs/cli-1.0-SNAPSHOT.jar --help
      - name: Verify IntelliJ plugin
        run: ./gradlew :plugin:verifyPluginStructure :plugin:verifyPluginProjectConfiguration :plugin:verifyPlugin --no-daemon
